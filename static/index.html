<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python + React Weather Dashboard</title>

    <!-- 1. Tailwind CSS (For clean, modern styling without writing custom CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. React Core Libraries (Loaded dynamically via CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- 3. Babel Compiler (Transforms JSX into normal JavaScript inside the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Chart.js (For visualizing our Temperature variables) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-800">

    <!-- This is the empty div where our entire React application will inject itself -->
    <div id="root"></div>
    <script type="text/babel" src="/static/app.js"></script>

</body>

</html>
